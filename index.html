<style>
/* Layout: one centred column like an instrument panel; every truth value is a signal lamp (green = wahr, red = falsch) */
:root {
  --bg: #eceff3;

  --true-soft: #e0f3ea;
  --false: #c03a30;
  --false-soft: #fae6e4;
  --op: #9a5300;
  --op-soft: #fbefdf;
  --code-bg: #f3f5f9;
  --display: 'Bricolage Grotesque', 'Segoe UI', system-ui, sans-serif;
  --body: 'Atkinson Hyperlegible', 'Segoe UI', system-ui, sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #10141a; --panel: #181e27; --panel-2: #1e2530; --ink: #e7ebf1; --muted: #9ba5b5; --line: #2b3442;
    --accent: #8d9dff; --accent-ink: #0e1220; --accent-soft: #232a4b;
    --true: #3fcf93; --true-soft: #15302a; --false: #ff7d71; --false-soft: #3a2020;
    --op: #f1b65c; --op-soft: #33281a; --code-bg: #141a22;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #10141a; --panel: #181e27; --panel-2: #1e2530; --ink: #e7ebf1; --muted: #9ba5b5; --line: #2b3442;
  --accent: #8d9dff; --accent-ink: #0e1220; --accent-soft: #232a4b;
  --true: #3fcf93; --true-soft: #15302a; --false: #ff7d71; --false-soft: #3a2020;
  --op: #f1b65c; --op-soft: #33281a; --code-bg: #141a22;
  color-scheme: dark;

* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font: 16px/1.55 var(--body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 48px;
}
.wrap { max-width: 780px; margin: 0 auto; }
h1, h2, h3 { font-family: var(--display); text-wrap: balance; margin: 0; line-height: 1.1; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, .card3:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
code, kbd, pre { font-family: var(--mono); }
kbd {
  font-size: 11px; padding: 1px 6px; border-radius: 4px; border: 1px solid currentColor;
  opacity: .6; margin-left: 6px; font-weight: 400;
}

/* Header */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 20px 8px; flex-wrap: wrap; }
.brand { background: none; border: 0; padding: 0; font: 800 26px/1 var(--display); letter-spacing: -.01em; }
.brand .amp { color: var(--op); font-weight: 500; }
.nav { display: flex; gap: 8px; }
.ghost {
  background: transparent; border: 1px solid var(--line); border-radius: 999px;
  padding: 6px 14px; font-size: 14px; color: var(--muted);
}
.ghost:hover { color: var(--ink); border-color: var(--muted); }

/* Home */
.hero { padding-block: 28px 20px; }
.hero h1 { font-size: clamp(32px, 6vw, 52px); font-weight: 800; letter-spacing: -.02em; }
.hero h1 em { font-style: normal; color: var(--accent); }
.hero p { color: var(--muted); max-width: 60ch; margin: 14px 0 0; font-size: 17px; }
.legend { display: flex; gap: 18px; margin-top: 16px; flex-wrap: wrap; font-size: 14px; color: var(--muted); }
.stations { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; margin-top: 12px; }
@media (max-width: 620px) { .stations { grid-template-columns: 1fr; } }

  padding: 18px 18px 16px; display: flex; flex-direction: column; gap: 8px; transition: transform .15s, border-color .15s;
}
.station:hover { border-color: var(--accent); transform: translateY(-2px); }
.station .eyebrow { margin: 0; }
.station h2 { font-size: 22px; }
.station p { margin: 0; color: var(--muted); font-size: 15px; }
.station .sample {
  font: 13px/1.5 var(--mono); background: var(--code-bg); border-radius: 8px; padding: 8px 10px;
  color: var(--ink); overflow-x: auto; white-space: nowrap;
}
.station .meta { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); margin-top: 2px; }
.station .meta b { color: var(--ink); font-variant-numeric: tabular-nums; }
.eyebrow { font: 600 11px/1 var(--mono); text-transform: uppercase; letter-spacing: .12em; color: var(--muted); margin-bottom: 10px; }

/* Lamps */
.lamp { display: inline-flex; align-items: center; gap: 7px; font: 600 11px/1 var(--mono); text-transform: uppercase; letter-spacing: .08em; white-space: nowrap; }
.lamp i { width: 10px; height: 10px; border-radius: 50%; background: var(--c); box-shadow: 0 0 0 3px color-mix(in srgb, var(--c) 22%, transparent), 0 0 10px color-mix(in srgb, var(--c) 70%, transparent); flex: none; }
.on-true { --c: var(--true); color: var(--true); }
.on-false { --c: var(--false); color: var(--false); }

/* Game chrome */
.gamebar { display: flex; align-items: center; gap: 14px; padding-block: 14px; flex-wrap: wrap; }
.gamebar h2 { font-size: 20px; flex: 1 1 auto; }
.score { font: 600 14px/1 var(--mono); font-variant-numeric: tabular-nums; color: var(--muted); display: flex; gap: 14px; }
.score b { color: var(--ink); }
.pips { display: flex; gap: 5px; margin-bottom: 16px; }
.pip { flex: 1; height: 6px; border-radius: 3px; background: var(--line); }
.pip.cur { background: var(--accent); }
.pip.ok { background: var(--true); }
.pip.bad { background: var(--false); }

.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 22px; }

.stage { display: flex; flex-direction: column; gap: 18px; }

.sign { background: var(--panel-2); border: 1px dashed var(--line); border-radius: 12px; padding: 16px 18px; }
.sign .rule { font: 700 clamp(19px, 3.2vw, 23px)/1.35 var(--display); margin: 0; text-wrap: pretty; }
.badge { display: inline-block; font: 600 10px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; background: var(--op-soft); color: var(--op); padding: 4px 7px; border-radius: 4px; margin-left: 8px; vertical-align: 1px; }
.hintbox { margin-top: 12px; }
.struct { font-size: 15px; line-height: 2; }
.atom { background: var(--accent-soft); border-radius: 5px; padding: 2px 6px; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
.op { color: var(--op); font-weight: 700; }
.struct .op, .steps .op, .tt .op { font: 700 12px/1 var(--mono); letter-spacing: .04em; background: var(--op-soft); padding: 3px 6px; border-radius: 4px; }
.paren { color: var(--muted); font-weight: 700; }
.guest { display: flex; gap: 16px; align-items: center; }
.avatar { width: 64px; height: 64px; border-radius: 50%; flex: none; display: grid; place-items: center; font: 800 22px/1 var(--display); color: #fff; background: hsl(var(--h) 52% 44%); }
.gname { font: 700 20px/1.2 var(--display); margin-bottom: 6px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); border-radius: 999px; padding: 3px 11px; font-size: 14px; background: var(--panel); }

/* Answers */
.answers { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.ans {
  border: 2px solid var(--line); background: var(--panel); border-radius: 12px; padding: 14px 10px;
  font-weight: 700; font-size: 16px; display: flex; align-items: center; justify-content: center; gap: 4px; text-align: center;
}
.ans:hover:not(:disabled) { border-color: var(--accent); }
.ans:disabled { cursor: default; opacity: .55; }
.ans.chosen { opacity: 1; }
.ans.is-right { border-color: var(--true); background: var(--true-soft); opacity: 1; }
.ans.is-wrong { border-color: var(--false); background: var(--false-soft); opacity: 1; }
.q { font: 700 18px/1.35 var(--display); margin: 0; }
.q code { font-size: 15px; background: var(--code-bg); padding: 2px 6px; border-radius: 5px; font-weight: 600; }

/* Code */
.codegrid { display: grid; grid-template-columns: minmax(0, 220px) minmax(0, 1fr); gap: 14px; align-items: start; }
@media (max-width: 620px) { .codegrid { grid-template-columns: minmax(0, 1fr); } }
.state { background: var(--panel-2); border-radius: 12px; padding: 14px; }

.state td { padding: 3px 0; vertical-align: top; word-break: break-all; }

.v-true { color: var(--true); font-weight: 600; }
.v-false { color: var(--false); font-weight: 600; }
pre.code {
  margin: 0; background: var(--code-bg); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px;
  font-size: 14px; line-height: 1.65; overflow-x: auto; min-width: 0;
}
pre.code .op, code .op { color: var(--op); font-weight: 600; background: none; padding: 0; font-size: inherit; letter-spacing: 0; }
.kw { color: var(--accent); font-weight: 600; }
.call { font-weight: 600; }
.opts { display: flex; flex-direction: column; gap: 8px; }
.opt {
  display: flex; gap: 12px; align-items: center; text-align: left; background: var(--panel);
  border: 2px solid var(--line); border-radius: 12px; padding: 12px 14px; min-width: 0;
}
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt:disabled { cursor: default; opacity: .55; }
.opt code { font-size: 14px; overflow-x: auto; white-space: nowrap; min-width: 0; }
.opt .num { font: 700 13px/1 var(--mono); width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: var(--panel-2); flex: none; }
.opt.is-right { border-color: var(--true); background: var(--true-soft); opacity: 1; }
.opt.is-wrong { border-color: var(--false); background: var(--false-soft); opacity: 1; }

/* Promise */
.promise blockquote { margin: 0; font: 700 clamp(20px, 3.4vw, 25px)/1.3 var(--display); text-wrap: pretty; }
.facts { display: flex; flex-direction: column; gap: 8px; }
.fact { display: flex; gap: 12px; align-items: center; background: var(--panel-2); border-radius: 10px; padding: 11px 14px; font-size: 17px; }
.fact .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }

/* Cards */
.cards { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 560px) { .cards { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.card3 {
  aspect-ratio: 3 / 4; max-width: 100%; perspective: 800px; background: none; border: 0; padding: 0; position: relative;
}
.card3 .inner { position: absolute; inset: 0; transition: transform .5s; transform-style: preserve-3d; }
.card3.flipped .inner { transform: rotateY(180deg); }
.face, .back {
  position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: 12px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 10px;
  border: 2px solid var(--line); background: var(--panel); font: 700 18px/1.2 var(--display); text-align: center; overflow-wrap: anywhere;
}
.card3.mono .face, .card3.mono .back { font: 600 14px/1.3 var(--mono); }
.back { transform: rotateY(180deg); background: var(--panel-2); border-style: dashed; }
.face small, .back small { font: 600 10px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); position: absolute; top: 9px; }
.card3.sel .face { border-color: var(--accent); background: var(--accent-soft); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 30%, transparent); }
.card3.need .back { border-color: var(--true); border-style: solid; }
.card3.miss .back { border-color: var(--false); border-style: solid; }
.card3 .mark { position: absolute; bottom: 9px; font: 600 10px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; }
.submit { justify-self: start; background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 12px; padding: 12px 22px; font-weight: 700; }
.submit:disabled { opacity: .5; cursor: default; }

/* Feedback */
.fb { margin-top: 16px; border-radius: 16px; padding: 20px 22px; border: 1px solid var(--line); background: var(--panel); }
@media (max-width: 520px) { .fb { padding: 16px; } }
.fb.ok { background: var(--true-soft); border-color: color-mix(in srgb, var(--true) 35%, transparent); }
.fb.bad { background: var(--false-soft); border-color: color-mix(in srgb, var(--false) 35%, transparent); }
.fb-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 8px; }
.fb-head h3 { font-size: 22px; }
.fb.ok h3 { color: var(--true); }
.fb.bad h3 { color: var(--false); }
.fb p { margin: 6px 0; }
.sub { font: 600 11px/1 var(--mono); text-transform: uppercase; letter-spacing: .12em; color: var(--muted); margin: 16px 0 8px; }
.steps { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 6px; }
.steps li { display: flex; justify-content: space-between; align-items: center; gap: 14px; background: var(--panel); border-radius: 8px; padding: 8px 12px; min-width: 0; }
.steps li.top { box-shadow: inset 0 0 0 2px var(--line); }
.steps .expr { min-width: 0; overflow-x: auto; line-height: 1.9; font-size: 15px; }
.steps .expr.mono { font: 13.5px/1.7 var(--mono); white-space: nowrap; }
.concl { font-weight: 700; }
.tip { margin-top: 14px; background: var(--panel); border-radius: 10px; padding: 12px 14px; font-size: 15px; display: flex; flex-direction: column; gap: 6px; }
.tip b { font-family: var(--display); }
.note { font-size: 15px; color: var(--muted); }
.next { background: var(--ink); color: var(--bg); border: 0; border-radius: 10px; padding: 10px 18px; font-weight: 700; }
.ttwrap { overflow-x: auto; }
.tt { border-collapse: collapse; font: 13px/1.4 var(--mono); background: var(--panel); border-radius: 8px; overflow: hidden; }
.tt th, .tt td { padding: 6px 12px; text-align: center; border-bottom: 1px solid var(--line); white-space: nowrap; }
.tt th { font-weight: 600; color: var(--muted); font-size: 12px; }
.tt tr.hl td { background: var(--accent-soft); font-weight: 700; }
.tt td.diff { outline: 2px solid var(--false); outline-offset: -3px; }
.tt tr:last-child td { border-bottom: 0; }
.w { color: var(--true); font-weight: 600; }
.f { color: var(--false); font-weight: 600; }
.cardlist { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 6px; }
.cardlist li { background: var(--panel); border-radius: 8px; padding: 8px 12px; font-size: 15px; }
.cardlist li b { font-family: var(--mono); font-size: 13px; }

/* End */
.end { text-align: left; display: flex; flex-direction: column; gap: 14px; }
.bigscore { font: 800 64px/1 var(--display); font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.bigscore span { font-size: 24px; color: var(--muted); font-weight: 500; }
.row { display: flex; gap: 10px; flex-wrap: wrap; }

/* Cheat sheet */
.sheet { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; margin-top: 8px; }
@media (max-width: 620px) { .sheet { grid-template-columns: 1fr; } }
.sheet .panel { display: flex; flex-direction: column; gap: 10px; padding: 18px; }
.sheet h3 { font-size: 19px; }
.sheet h3 .op { font: 700 13px/1 var(--mono); background: var(--op-soft); padding: 4px 7px; border-radius: 4px; margin-left: 6px; vertical-align: 2px; }
.sheet p { margin: 0; font-size: 15px; }
.sheet .ex { color: var(--muted); }
.sheet .wide { grid-column: 1 / -1; }

@media (prefers-reduced-motion: reduce) {
  .card3 .inner, .station { transition: none; }
}
</style>

  <header class="top">

  <main id="end" hidden></main>
  <main id="sheet" hidden></main>
</div>

<script>

  const op = s => '<span class="op">' + s + '</span>';
  const w = c => isCompound(c) ? '<span class="paren">(</span>' + nat(c, V) + '<span class="paren">)</span>' : nat(c, V);
  switch (n.t) {
    case 'var': return '<span class="atom">' + esc(V[n.k].pos) + '</span>';
    case 'not': return n.a.t === 'var' ? '<span class="atom">' + esc(V[n.a.k].neg) + '</span>' : op('NICHT') + ' ' + w(n.a);
    case 'and': return n.a.map(w).join(' ' + op('UND') + ' ');
    case 'or': return n.a.map(w).join(' ' + op('ODER') + ' ');
    case 'imp': return op('WENN') + ' ' + w(n.a) + ' ' + op('DANN') + ' ' + w(n.b);
    case 'xor': return op('ENTWEDER') + ' ' + w(n.a) + ' ' + op('ODER') + ' ' + w(n.b);
    case 'iff': return w(n.a) + ' ' + op('GENAU DANN, WENN') + ' ' + w(n.b);
  }
}

/* C# rendering */
const PREC = { var: 9, not: 8, iff: 6, xor: 5, and: 3, or: 2 };
const isBin = t => t === 'and' || t === 'or' || t === 'xor' || t === 'iff';
function code(n, V, min) {
  const op = s => '<span class="op">' + s + '</span>';
  const atom = k => '<span class="id">' + esc(V[k].code) + '</span>';
  const w = (c, p) => {
    const need = isBin(c.t) && (PREC[c.t] < PREC[p.t] || c.t === 'xor' || c.t === 'iff' || (!min && c.t !== p.t));
    return need ? '(' + code(c, V, min) + ')' : code(c, V, min);
  };
  switch (n.t) {
    case 'var': return atom(n.k);
    case 'not':
      if (n.a.t === 'var' && !V[n.a.k].complex) { return op('!') + atom(n.a.k); }
      if (n.a.t === 'not') { return op('!') + code(n.a, V, min); }
      return op('!') + '(' + code(n.a, V, min) + ')';
    case 'and': return n.a.map(c => w(c, n)).join(' ' + op('&amp;&amp;') + ' ');
    case 'or': return n.a.map(c => w(c, n)).join(' ' + op('||') + ' ');
    case 'xor': return w(n.a, n) + ' ' + op('^') + ' ' + w(n.b, n);
    case 'iff': return w(n.a, n) + ' ' + op('==') + ' ' + w(n.b, n);
    case 'imp': return code(or(not(n.a), n.b), V, min);
  }
}

const lamp = v => '<span class="lamp ' + (v ? 'on-true' : 'on-false') + '"><i></i>' + (v ? 'wahr' : 'falsch') + '</span>';
function stepList(ast, render, env, mono) {
  const list = steps(ast);
  return '<ol class="steps">' + list.map((n, i) =>
    '<li' + (i === list.length - 1 ? ' class="top"' : '') + '><span class="expr' + (mono ? ' mono' : '') + '">' + render(n) + '</span>' + lamp(ev(n, env)) + '</li>'
  ).join('') + '</ol>';
}
function truthTable(keys, label, cols, opts) {
  opts = opts || {};
  const fmt = opts.fmt || (v => v ? '<span class="w">W</span>' : '<span class="f">F</span>');
  const hl = opts.highlight;
  let h = '<div class="ttwrap"><table class="tt"><thead><tr>' + keys.map(k => '<th>' + label(k) + '</th>').join('') + cols.map(c => '<th>' + c.label + '</th>').join('') + '</tr></thead><tbody>';
  allEnvs(keys).forEach(e => {
    const isHl = hl && keys.every(k => !!hl[k] === e[k]);
    const ref = ev(cols[0].ast, e);
    h += '<tr' + (isHl ? ' class="hl"' : '') + '>' + keys.map(k => '<td>' + (e[k] ? '<span class="w">W</span>' : '<span class="f">F</span>') + '</td>').join('');
    cols.forEach((c, i) => {
      const v = ev(c.ast, e);
      const diff = opts.diff && i > 0 && v !== ref;
      h += '<td' + (diff ? ' class="diff"' : '') + '>' + fmt(v) + '</td>';
    });
    h += '</tr>';
  });
  return h + '</tbody></table></div>';
}

function renderRun(it, el) {
  const s = it.s;
  const eff = effective(s);
  const fn = s.body.replace(/;$/, '');
  el.innerHTML =
    '<div class="codegrid"><div class="state"><div class="eyebrow">Zustand zur Laufzeit</div>' + stateHtml(varsOf(eff), it.env) + '</div>' +
    '<pre class="code">' + snippetHtml(s) + '</pre></div>' +
    '<p class="q">Wird <code>' + esc(fn) + '</code> ausgeführt?</p>' +
    '<div class="answers"><button class="ans" data-a="0">Nein <kbd>←</kbd></button><button class="ans" data-a="1">Ja <kbd>→</kbd></button></div>';
  wireBinary(val => {
    const truth = ev(eff, it.env);
    markBinary(val, truth);
    let html = '';
    if (s.kind === 'if') {
      if (s.min) { html += '<p class="note">So liest der Compiler die Bedingung: <code>' + C(s.cond, false) + '</code></p>'; }
      html += '<div class="sub">Auswertung der Bedingung</div>' + stepList(s.cond, n => C(n, false), it.env, true);
    } else {
      for (let i = 0; i < s.guards.length; i++) {
        const g = s.guards[i];
        const hit = ev(g, it.env);
        if (s.min) { html += '<p class="note">So liest der Compiler den Guard: <code>' + C(g, false) + '</code></p>'; }
        html += '<div class="sub">Guard' + (s.guards.length > 1 ? ' ' + (i + 1) : '') + ': ' + (hit ? 'greift, also return' : 'greift nicht') + '</div>' + stepList(g, n => C(n, false), it.env, true);
        if (hit) { break; }
      }
    }
    html += '<p class="concl">Ergebnis: <code>' + esc(fn) + '</code> ' + (truth ? 'wird ausgeführt.' : 'wird übersprungen.') + '</p>';
    resolve(val === truth, html, s.tags);
  });
}

function renderEq(it, el) {
  const p = it.p;
  el.innerHTML =
    '<pre class="code">' + (p.display ? p.display() : C(p.orig, p.min)) + '</pre>' +
    '<p class="q">' + esc(p.q || 'Welche Bedingung verhält sich in jedem Fall genau gleich?') + '</p>' +
    '<div class="opts">' + it.opts.map((o, i) => '<button class="opt" data-i="' + i + '"><span class="num">' + (i + 1) + '</span><code>' + C(o, p.min) + '</code></button>').join('') + '</div>';
  const choose = i => {
    if (S.answered) { return; }
    const chosen = it.opts[i];
    const correctIdx = it.opts.findIndex(o => !counterexample(p.orig, o));
    const ok = i === correctIdx;
    $$('.opt', el).forEach((b, j) => {
      b.disabled = true;
      if (j === correctIdx) { b.classList.add('is-right'); }
      else if (j === i) { b.classList.add('is-wrong'); }
    });
    const keys = varsOf(chosen, varsOf(p.orig));
    let html = '';
    if (!ok) {
      const ce = counterexample(p.orig, chosen);
      html += '<p>Gegenbeispiel, bei dem sich deine Wahl anders verhält:</p><div class="state">' + stateHtml(keys, ce) + '</div>' +
        '<p>Original: ' + lamp(ev(p.orig, ce)) + ' &nbsp; Deine Wahl: ' + lamp(ev(chosen, ce)) + '</p>';
    } else {
      html += '<p>In allen ' + (1 << keys.length) + ' Kombinationen liefern beide denselben Wert.</p>';
    }
    const cols = [{ label: 'Original', ast: p.orig }].concat(it.opts.map((o, j) => ({ label: 'Option ' + (j + 1), ast: o })));
    html += '<div class="sub">Wahrheitstafel (rot umrandet: weicht vom Original ab)</div>' +
      truthTable(keys, k => esc(V_CODE[k].code), cols, { diff: true });
    resolve(ok, html, p.tags);
  };
  $$('.opt', el).forEach(b => { b.onclick = () => choose(+b.dataset.i); });
  it.opts.forEach((_, i) => { S.keys[String(i + 1)] = () => choose(i); });
}

/* ============================================================

const MODES = { door: DOOR, code: CODE, promise: PROMISE, wason: WASON_STATION };
const S = { mode: null, items: [], i: 0, score: 0, streak: 0, results: [], answered: false, keys: {} };
const BEST_KEY = 'wenn-und-aber-best';
function loadBest() { try { return JSON.parse(localStorage.getItem(BEST_KEY)) || {}; } catch (e) { return {}; } }
function saveBest(b) { try { localStorage.setItem(BEST_KEY, JSON.stringify(b)); } catch (e) { /* storage unavailable */ } }

function showView(id) {
  ['home', 'game', 'end', 'sheet'].forEach(v => { $('#' + v).hidden = v !== id; });
  window.scrollTo(0, 0);
}

function hintBox(structHtml) {
  return '<div class="hintbox"><button class="ghost" id="hintBtn">Struktur zeigen (halbe Punkte) <kbd>H</kbd></button><div class="struct" id="struct" hidden>' + structHtml + '</div></div>';
}
function wireHint(it) {
  const b = $('#hintBtn');
  if (!b) { return; }
  const f = () => { if (S.answered) { return; } it.hint = true; revealHint(); };
  b.onclick = f;
  S.keys.h = f;
  S.keys.H = f;
}
function revealHint() {
  const s = $('#struct');
  const b = $('#hintBtn');
  if (s) { s.hidden = false; }
  if (b) { b.hidden = true; }
}
function wireBinary(fn) {
  const go = v => { if (!S.answered) { fn(v); } };
  $$('.ans', $('#stage')).forEach(b => { b.onclick = () => go(b.dataset.a === '1'); });
  S.keys.ArrowLeft = () => go(false);
  S.keys.ArrowRight = () => go(true);
}
function markBinary(chosen, truth) {
  $$('.ans', $('#stage')).forEach(b => {
    const v = b.dataset.a === '1';
    b.disabled = true;
    if (v === truth) { b.classList.add('is-right'); }
    else if (v === chosen) { b.classList.add('is-wrong'); }
  });
}

function startMode(m) {
  S.mode = m;
  S.items = MODES[m].build();
  S.i = 0; S.score = 0; S.streak = 0; S.results = [];
  $('#gTitle').textContent = MODES[m].title;
  showView('game');
  renderItem();
}
function renderPips() {
  $('#pips').innerHTML = S.items.map((_, i) => {
    const r = S.results[i];
    return '<span class="pip ' + (r ? (r.ok ? 'ok' : 'bad') : (i === S.i ? 'cur' : '')) + '"></span>';
  }).join('');
}
function renderItem() {
  S.answered = false;
  S.keys = {};
  $('#fb').hidden = true;
  $('#gScore').textContent = S.score;
  $('#gStreak').textContent = S.streak;
  renderPips();
  MODES[S.mode].render(S.items[S.i], $('#stage'));
}
function resolve(ok, html, tags) {
  if (S.answered) { return; }
  S.answered = true;
  const it = S.items[S.i];
  const pts = ok ? (it.hint ? 5 : 10) : 0;
  S.score += pts;
  S.streak = ok ? S.streak + 1 : 0;
  S.results.push({ ok, tags });
  $('#gScore').textContent = S.score;
  $('#gStreak').textContent = S.streak;
  renderPips();
  const last = S.i === S.items.length - 1;
  const fb = $('#fb');
  fb.className = 'fb ' + (ok ? 'ok' : 'bad');
  fb.innerHTML =
    '<div class="fb-head"><h3>' + (ok ? (it.hint ? 'Richtig, mit Hinweis (+5)' : 'Richtig (+10)') : 'Daneben') + '</h3>' +
    '<button class="next" id="nextBtn">' + (last ? 'Auswertung' : 'Weiter') + ' <kbd>Enter</kbd></button></div>' +
    html + (ok ? '' : tipHtml(tags));
  fb.hidden = false;
  $('#nextBtn').onclick = next;
  $('#nextBtn').focus({ preventScroll: true });
  fb.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'nearest' });
}
function next() {
  S.i++;
  if (S.i >= S.items.length) { endRound(); } else { renderItem(); window.scrollTo({ top: 0 }); }
}
function endRound() {
  const max = S.items.length * 10;
  const right = S.results.filter(r => r.ok).length;
  const best = loadBest();
  const isBest = !(S.mode in best) || S.score > best[S.mode];
  if (isBest) { best[S.mode] = S.score; saveBest(best); }
  const miss = {};
  S.results.filter(r => !r.ok).forEach(r => [...new Set(r.tags)].forEach(t => { miss[t] = (miss[t] || 0) + 1; }));
  const missTags = Object.keys(miss).sort((a, b) => miss[b] - miss[a]);
  const pct = S.score / max;
  const verdict = pct >= 0.9 ? 'Da sitzt jede Verknüpfung.' : pct >= 0.7 ? 'Solide. Ein, zwei Stolpersteine sind noch drin.' : pct >= 0.5 ? 'Auf gutem Weg. Schau dir die Stolpersteine unten an.' : 'Das ist Übungssache. Der Spickzettel hilft beim nächsten Durchgang.';
  $('#end').innerHTML =
    '<div class="panel end" style="margin-top:16px"><div class="eyebrow">' + esc(MODES[S.mode].title) + ' · Auswertung</div>' +
    '<div class="bigscore">' + S.score + '<span> / ' + max + ' Punkte</span></div>' +
    '<p style="margin:0">' + right + ' von ' + S.items.length + ' richtig. ' + esc(verdict) + (isBest && S.score > 0 ? ' Neuer Bestwert.' : '') + '</p>' +
    (missTags.length ? '<div><div class="sub">Deine Stolpersteine</div><div class="tip" style="background:var(--panel-2)">' +
      missTags.map(t => '<div><b>' + esc(TAGS[t][0]) + ' (' + miss[t] + '×):</b> ' + esc(TAGS[t][1]) + '</div>').join('') + '</div></div>' : '') +
    '<div class="row"><button class="submit" id="againBtn">Neue Runde</button><button class="ghost" id="backBtn">Andere Station</button></div></div>';
  showView('end');
  $('#againBtn').onclick = () => startMode(S.mode);
  $('#backBtn').onclick = goHome;
  $('#againBtn').focus({ preventScroll: true });
}

function goHome() {
  const best = loadBest();
  const max = { door: 100, code: 100, promise: 100, wason: 50 };
  $('#stations').innerHTML = Object.keys(MODES).map(k => {
    const m = MODES[k];
    return '<button class="station" data-m="' + k + '"><div class="eyebrow">' + m.tag + '</div><h2>' + esc(m.title) + '</h2><p>' + esc(m.blurb) + '</p>' +
      '<div class="sample">' + esc(m.sample) + '</div>' +
      '<div class="meta"><span>' + (k === 'wason' ? '5 Regeln' : '10 Fragen') + '</span><span>Bestwert <b>' + (k in best ? best[k] : '–') + '</b> / ' + max[k] + '</span></div></button>';
  }).join('');
  $$('.station').forEach(b => { b.onclick = () => startMode(b.dataset.m); });
  showView('home');
}

/* ---------- cheat sheet ---------- */
function renderSheet() {
  const A = { A: { pos: 'A', neg: 'nicht A' }, B: { pos: 'B', neg: 'nicht B' } };
  const t = (ast, keys) => truthTable(keys || ['A', 'B'], k => k, [{ label: 'Ergebnis', ast }]);
  const card = (title, op, text, ex, table, wide) =>
    '<div class="panel' + (wide ? ' wide' : '') + '"><h3>' + esc(title) + (op ? '<span class="op">' + op + '</span>' : '') + '</h3><p>' + text + '</p>' + (ex ? '<p class="ex">' + ex + '</p>' : '') + (table || '') + '</div>';
  $('#sheet').innerHTML =
    '<section class="hero" style="padding-bottom:8px"><h1>Spickzettel</h1><p>Alle Verknüpfungen auf einen Blick. W steht für wahr, F für falsch.</p></section>' +
    '<div class="sheet">' +
    card('UND', '&amp;&amp;', 'Streng: alle Teile müssen wahr sein.', 'Volljährig UND Ticket: Wer nur eins davon hat, bleibt draußen.', t(and(at('A'), at('B')))) +
    card('ODER', '||', 'Großzügig: ein wahrer Teil reicht, beide dürfen.', 'Ticket ODER Gästeliste: Wer beides hat, kommt natürlich auch rein.', t(or(at('A'), at('B')))) +
    card('NICHT', '!', 'Dreht den Wert um.', 'NICHT Turnschuhe: wahr, wenn jemand Lederschuhe trägt.', t(not(at('A')), ['A'])) +
    card('ENTWEDER–ODER', '^', 'Genau einer. Das ist das „oder“, das man im Alltag oft meint.', '„Kaffee oder Tee?“ heißt meistens: nicht beides.', t(xor(at('A'), at('B')))) +
    card('WENN A DANN B', '!A || B', 'Nur gebrochen, wenn A eintritt und B ausbleibt. Tritt A nicht ein, ist alles erlaubt.', 'Wenn es regnet, nehme ich den Schirm. Bei Sonne mit Schirm: kein Bruch.', t(imp(at('A'), at('B')))) +
    card('GENAU DANN, WENN', '==', 'Beide Seiten haben denselben Wert.', 'Licht an genau dann, wenn jemand im Raum ist.', t(iff(at('A'), at('B')))) +
    card('Umgangssprache übersetzen', '', '„A nur, wenn B“ = WENN A DANN B.<br>„Ohne B kein A“ = WENN A DANN B.<br>„A, es sei denn B“ = WENN NICHT B DANN A.<br>„Wer A ist, bleibt draußen“ = rein darf: NICHT A.', 'Die Richtung bei „nur wenn“ ist die häufigste Verwechslung.', '', true) +
    card('De Morgan', '', 'Zieht man ein NICHT in die Klammer, kippt UND zu ODER und umgekehrt.<br><code>!(a &amp;&amp; b) == !a || !b</code><br><code>!(a || b) == !a &amp;&amp; !b</code>', '„Wer Turnschuhe oder Jogginghose trägt, bleibt draußen“ heißt: rein darf, wer keine Turnschuhe UND keine Jogginghose trägt.', '', true) +
    card('Vorrang und Guards in C#', '', '<code>!</code> bindet am stärksten, dann <code>&amp;&amp;</code>, dann <code>||</code>. Also: <code>a || b &amp;&amp; c</code> = <code>a || (b &amp;&amp; c)</code>.<br>Ein Guard <code>if (X) return;</code> lässt den Rest nur laufen, wenn X falsch ist. Zwei Guards hintereinander: <code>!X &amp;&amp; !Y</code>.', '', '', true) +
    card('Regeln prüfen (Karten umdrehen)', '', 'Eine Regel WENN A DANN B kann nur ein Fall mit A und ohne B verletzen. Prüfe die Fälle mit A und die Fälle ohne B. Fälle mit B oder ohne A sind egal.', '', '', true) +
    '</div><div class="row" style="margin-top:18px"><button class="submit" id="sheetBack">Zurück zu den Stationen</button></div>';
  $('#sheetBack').onclick = goHome;
  showView('sheet');
}

/* ---------- global wiring ---------- */
$('#homeBtn').onclick = goHome;
$('#sheetBtn').onclick = renderSheet;
document.addEventListener('keydown', e => {
  if ($('#game').hidden || e.ctrlKey || e.metaKey || e.altKey) { return; }
  if (e.key === 'Enter' && e.target.tagName === 'BUTTON' && !(e.target.classList.contains('card3') && !S.answered)) { return; }
  if (S.answered) {
    if (e.key === 'Enter') { e.preventDefault(); next(); }
    return;
  }
  const f = S.keys[e.key];
  if (f) { e.preventDefault(); f(); }
});

goHome();
})();
</script>
